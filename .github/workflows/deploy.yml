name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit, and so the first one can
  # be triggered deliberately rather than by surprise.
  workflow_dispatch:
    inputs:
      targets:
        description: What to deploy
        type: choice
        default: all
        options: [all, api, web, migrations]

# Never two deploys at once. `cancel-in-progress: false` on purpose — cancelling
# a half-finished deploy or a migration is worse than queueing behind it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Both the API and the web app go to Cloudflare Workers. The API is a real
# Worker (services/api/src/worker.ts); the web app is a static bundle served
# from the edge. Background jobs run from the API Worker's `scheduled()` handler
# on a Cron Trigger, so there is no third thing to deploy.
#
# The Fly path (Dockerfile, fly.toml, fly.worker.toml) is still supported and
# still in the repo — see docs/deploy.md. Nothing in the application code knows
# which one is in use, which is the whole point of the portability contract.

jobs:
  # Deployment turns itself on one target at a time, as the secrets appear.
  # A fresh repository deploys nothing and says so, instead of failing red
  # because nobody has made a Cloudflare account yet.
  gate:
    name: What is configured
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.check.outputs.db }}
      cloudflare: ${{ steps.check.outputs.cloudflare }}
    steps:
      - id: check
        # Passed through `env`, never interpolated into the script: a secret
        # containing a quote would otherwise rewrite the command around it.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          have() { [ -n "$1" ] && echo true || echo false; }
          echo "db=$(have "$DATABASE_URL")" >> "$GITHUB_OUTPUT"
          echo "cloudflare=$(have "$CLOUDFLARE_API_TOKEN")" >> "$GITHUB_OUTPUT"
      - name: Say what will happen
        run: |
          {
            echo "### Deploy plan"
            echo ""
            echo "| Target | Configured |"
            echo "|---|---|"
            echo "| Migrations | ${{ steps.check.outputs.db }} |"
            echo "| API → Cloudflare Workers | ${{ steps.check.outputs.cloudflare }} |"
            echo "| Web → Cloudflare Workers | ${{ steps.check.outputs.cloudflare }} |"
            echo ""
            echo "Anything marked \`false\` is missing a secret — see \`docs/deploy.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploying something that does not compile is worse than not deploying.
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests/
      - run: bun run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

  # First, always. The new API may depend on a column the old schema does not
  # have. Every migration so far is additive, which is what makes this order
  # safe — a destructive one needs its own two-step release (docs/deploy.md).
  migrations:
    name: Migrate production
    needs: [gate, verify]
    if: >-
      needs.gate.outputs.db == 'true' &&
      (github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'migrations')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun x supabase db push --db-url "$DATABASE_URL" --include-all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Not decoration: this is what catches a migration that applied but left
      # a table without a policy, or a trigger that did not get created.
      - name: Verify the result
        run: bun scripts/verify-supabase.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  api:
    name: API → Cloudflare Workers
    needs: [gate, verify, migrations]
    # `always()` so a skipped migrations job does not skip this one too, but a
    # *failed* one still stops it.
    if: >-
      always() && needs.verify.result == 'success' &&
      needs.migrations.result != 'failure' && needs.migrations.result != 'cancelled' &&
      needs.gate.outputs.cloudflare == 'true' &&
      (github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'api')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile

      # Secrets already live in Cloudflare (`wrangler secret put`), so the
      # deploy carries only code. This is why rotating a key does not need a
      # rebuild.
      - name: Deploy
        run: bun run deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A deploy that reports success while the app answers 500 is a deploy
      # that gets noticed by a member first.
      - name: Check it is actually up
        if: vars.API_URL != ''
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "$API_URL/health" || true)
            echo "$body"
            case "$body" in
              *'"source":"supabase"'*)
                echo "Healthy and talking to Postgres."
                exit 0 ;;
              *'"source":"seed"'*)
                # The API serves fixtures rather than crashing when it has no
                # database. Right on a laptop, very wrong here.
                echo "::error::/health reports \"seed\" — the DATABASE_URL secret did not reach the Worker. Run: bun x wrangler secret put DATABASE_URL --config services/api/wrangler.jsonc"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::/health never answered."
          exit 1

  web:
    name: Web → Cloudflare Workers
    needs: [gate, verify]
    if: >-
      always() && needs.verify.result == 'success' &&
      needs.gate.outputs.cloudflare == 'true' &&
      (github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'web')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile

      # Built here rather than reused from `verify`: these VITE_* values are
      # baked into the bundle, so the artefact has to be produced with the
      # production ones.
      - name: Build and deploy
        run: bun run deploy:web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
