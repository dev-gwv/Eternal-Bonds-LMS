name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit, and so the first one can
  # be triggered deliberately rather than by surprise.
  workflow_dispatch:
    inputs:
      targets:
        description: What to deploy
        type: choice
        default: all
        options: [all, api, worker, web, migrations]

# Never two deploys at once. `cancel-in-progress: false` on purpose — cancelling
# a half-finished `fly deploy` or a migration is worse than queueing behind it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Deployment turns itself on one target at a time, as the secrets appear.
  # A fresh repository deploys nothing and says so, instead of failing red.
  gate:
    name: What is configured
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.check.outputs.db }}
      fly: ${{ steps.check.outputs.fly }}
      cloudflare: ${{ steps.check.outputs.cloudflare }}
    steps:
      - id: check
        run: |
          have() { [ -n "$1" ] && echo true || echo false; }
          echo "db=$(have '${{ secrets.DATABASE_URL }}')" >> "$GITHUB_OUTPUT"
          echo "fly=$(have '${{ secrets.FLY_API_TOKEN }}')" >> "$GITHUB_OUTPUT"
          echo "cloudflare=$(have '${{ secrets.CLOUDFLARE_API_TOKEN }}')" >> "$GITHUB_OUTPUT"
      - name: Say what will happen
        run: |
          echo "### Deploy plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | Configured |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migrations | ${{ steps.check.outputs.db }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| API + worker (Fly) | ${{ steps.check.outputs.fly }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Web (Cloudflare) | ${{ steps.check.outputs.cloudflare }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Anything marked \`false\` is missing a secret — see \`docs/deploy.md\`." >> "$GITHUB_STEP_SUMMARY"

  # Deploying something that does not compile is worse than not deploying.
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests/
      - run: bun run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

  # First, always. The new API may depend on a column the old schema does not
  # have. Every migration so far is additive, which is what makes this order
  # safe — a destructive one needs its own two-step release (docs/deploy.md).
  migrations:
    name: Migrate production
    needs: [gate, verify]
    if: needs.gate.outputs.db == 'true' && (github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'migrations')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun x supabase db push --db-url "$DATABASE_URL" --include-all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Not decoration: this is what catches a migration that applied but left
      # a table without a policy, or a trigger that did not get created.
      - name: Verify the result
        run: bun scripts/verify-supabase.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  api:
    name: API → Fly
    needs: [gate, verify, migrations]
    # `always()` so a skipped migrations job does not skip this one too, but
    # a *failed* one still stops it.
    if: >-
      always() && needs.verify.result == 'success' &&
      needs.migrations.result != 'failure' && needs.migrations.result != 'cancelled' &&
      needs.gate.outputs.fly == 'true' &&
      (github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'api')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A deploy that reports success while the app answers 502 is a deploy
      # that gets noticed by a member first.
      - name: Check it is actually up
        if: vars.API_URL != ''
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "${{ vars.API_URL }}/health" || true)
            echo "$body"
            source=$(echo "$body" | grep -o '"source":"[a-z]*"' || true)
            if [ "$source" = '"source":"supabase"' ]; then
              echo "Healthy and talking to Postgres."
              exit 0
            fi
            # "seed" means DATABASE_URL never arrived: the API serves fixtures
            # rather than crashing, which is right on a laptop and wrong here.
            if [ -n "$source" ]; then
              echo "::error::/health reports $source — the DATABASE_URL secret did not reach the app."
              exit 1
            fi
            sleep 10
          done
          echo "::error::/health never answered."
          exit 1

  worker:
    name: Worker → Fly
    needs: [gate, verify, api]
    if: >-
      always() && needs.verify.result == 'success' &&
      needs.api.result != 'failure' && needs.api.result != 'cancelled' &&
      needs.gate.outputs.fly == 'true' &&
      (github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'worker')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Same image, different command, no public address.
      - run: flyctl deploy --remote-only -c fly.worker.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  web:
    name: Web → Cloudflare
    needs: [gate, verify]
    if: >-
      always() && needs.verify.result == 'success' &&
      needs.gate.outputs.cloudflare == 'true' &&
      (github.event_name == 'push' || inputs.targets == 'all' || inputs.targets == 'web')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile

      # Built here rather than downloaded from `verify`: these VITE_* values
      # are baked into the bundle, so the artefact has to be produced with the
      # production ones.
      - name: Build and deploy
        run: bun run deploy:web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
