<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Two interlocking rings that also read as a lens: the club is called
       Eternal Bonds and its members shoot weddings, so the mark carries the
       name and the subject at once. Strokes rather than fills so it survives
       being 16px in a browser tab. -->
  <defs>
    <linearGradient id="g" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8578f"/>
      <stop offset="100%" stop-color="#c2306a"/>
    </linearGradient>
  </defs>
  <path d="M16 8.6a8.4 8.4 0 0 1 0 14.8 8.4 8.4 0 0 1 0-14.8Z" fill="url(#g)" opacity="0.18"/>
  <circle cx="11.8" cy="16" r="7.2" fill="none" stroke="url(#g)" stroke-width="2.4"/>
  <circle cx="20.2" cy="16" r="7.2" fill="none" stroke="url(#g)" stroke-width="2.4"/>
  <circle cx="16" cy="12.4" r="1.15" fill="url(#g)"/>
</svg>
